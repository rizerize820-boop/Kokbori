name: Build KOKBORI Godot iOS app (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Engine/**"
      - ".github/workflows/build-godot-ios-unsigned.yml"

permissions:
  contents: read

jobs:
  build-godot-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and iOS export templates
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo ditto "$RUNNER_TEMP/godot/Godot.app" /Applications/Godot.app
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"

      - name: Import and validate Godot project
        run: |
          set -euxo pipefail
          GODOT="/Applications/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --editor --path Engine --quit
          "$GODOT" --headless --path Engine --quit-after 2

      - name: Export Xcode project
        run: |
          set -euxo pipefail
          GODOT="/Applications/Godot.app/Contents/MacOS/Godot"
          mkdir -p Engine/build
          "$GODOT" --headless --path Engine --export-debug "iOS" build/KOKBORI-Godot-iOS
          test -d Engine/build/KOKBORI-Godot-iOS
          find build/KOKBORI-Godot-iOS -maxdepth 4 -name '*.xcodeproj' -print

      - name: Build unsigned iOS app with Xcode
        run: |
          set -euxo pipefail
          PROJECT="$(find Engine/build/KOKBORI-Godot-iOS -maxdepth 4 -name '*.xcodeproj' -print -quit)"
          test -n "$PROJECT"
          xcodebuild -list -project "$PROJECT"
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release -derivedDataPath "$RUNNER_TEMP/KOKBORI-Godot-DerivedData" CODE_SIGNING_ALLOWED=NO
          APP="$(find "$RUNNER_TEMP/KOKBORI-Godot-DerivedData/Build/Products" -maxdepth 3 -name '*.app' -print -quit)"
          test -d "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/KOKBORI-RP.app
          /usr/bin/zip -qry KOKBORI-Godot-iOS-unsigned.ipa Payload

      - name: Upload unsigned Godot IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-Godot-iOS-unsigned-IPA
          path: KOKBORI-Godot-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
