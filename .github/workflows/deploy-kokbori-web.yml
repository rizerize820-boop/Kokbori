name: Publish KOKBORI Browser Playtest

on:
  workflow_dispatch:
  push:
    branches: [main, unity-foundation]
    paths:
      - "Engine/**"
      - ".github/workflows/deploy-kokbori-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kokbori-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install Godot 4.3 and export templates
        run: |
          set -eux
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable" "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Import project
        run: godot --headless --editor --path Engine --quit

      - name: Export Web build
        run: |
          mkdir -p site
          godot --headless --path Engine --export-release "Web" site/index.html
          touch site/.nojekyll

      - name: Upload downloadable browser build
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-Web-Playtest
          path: site
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
