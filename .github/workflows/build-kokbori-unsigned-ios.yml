name: Build KOKBORI game (iOS, unsigned IPA)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and iOS export templates
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip \
            -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo ditto "$RUNNER_TEMP/godot/Godot.app" /Applications/Godot.app
          curl -L --fail --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o "$RUNNER_TEMP/godot/export_templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/export_templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"

      - name: Import Godot project
        run: |
          set -eux
          "/Applications/Godot.app/Contents/MacOS/Godot" --headless --editor --path Engine --quit

      - name: Diagnose iOS export configuration
        if: always()
        run: |
          set +e
          echo "=== Godot version ==="
          /Applications/Godot.app/Contents/MacOS/Godot --version
          echo "=== iOS export template ==="
          TEMPLATE="$HOME/Library/Application Support/Godot/export_templates/4.3.stable/ios.zip"
          if [ -s "$TEMPLATE" ]; then echo "FOUND: $TEMPLATE"; else echo "MISSING: $TEMPLATE"; fi
          echo "=== iOS preset ==="
          sed -n '/^\[preset\.1\]/,$p' Engine/export_presets.cfg
          echo "=== Required values ==="
          python3 - <<'PY'
          import configparser, pathlib, re, sys
          p = configparser.ConfigParser(interpolation=None)
          p.read("Engine/export_presets.cfg")
          section = "preset.1.options"
          values = dict(p[section]) if p.has_section(section) else {}
          checks = {
              "bundle identifier": values.get("application/bundle_identifier", ""),
              "short version": values.get("application/short_version", ""),
              "version": values.get("application/version", ""),
              "app store team id": values.get("application/app_store_team_id", ""),
          }
          for name, value in checks.items():
              print(f"{name}: {value if value else '<EMPTY>'}")
          bundle = checks["bundle identifier"]
          if not re.fullmatch(r"[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+", bundle):
              print("ERROR: bundle identifier format is invalid")
          team = checks["app store team id"]
          if team and (team.startswith("YOUR_") or len(team) != 10):
              print("ERROR: Team ID is a placeholder or not 10 characters")
          project = pathlib.Path("Engine/project.godot").read_text()
          print("ETC2/ASTC enabled:", "textures/vram_compression/import_etc2_astc=true" in project)
          for key, value in values.items():
              if any(token in key for token in ("icon", "launch", "splash")) and value:
                  path = pathlib.Path("Engine") / value.replace("res://", "")
                  print(f"resource {key}: {path} -> {'FOUND' if path.exists() else 'MISSING'}")
          PY

      - name: Export Xcode project
        run: |
          set -eux
          mkdir -p build/ios
          set -o pipefail
          if ! "/Applications/Godot.app/Contents/MacOS/Godot" --headless --verbose --path Engine --export-release "iOS" "$GITHUB_WORKSPACE/build/ios/KOKBORI-iOS.zip" 2>&1 | tee "$GITHUB_WORKSPACE/build/ios/godot-export.log"; then
            echo "=== Godot export failed; relevant diagnostics ==="
            grep -Ein -C 3 "error|warning|team|template|ETC2|ASTC|export" "$GITHUB_WORKSPACE/build/ios/godot-export.log" || true
            echo "=== Full export log ==="
            cat "$GITHUB_WORKSPACE/build/ios/godot-export.log"
            exit 1
          fi
          PROJECT=$(find "$GITHUB_WORKSPACE/build/ios" -maxdepth 4 -name "*.xcodeproj" -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Godot export completed but no .xcodeproj was found."
            echo "=== Export output ==="
            find "$GITHUB_WORKSPACE/build/ios" -maxdepth 3 -print
            exit 1
          fi
          echo "Found Xcode project: $PROJECT"

      - name: Build Xcode project without signing
        run: |
          set -eux
          PROJECT=$(find "$GITHUB_WORKSPACE/build/ios" -maxdepth 4 -name "*.xcodeproj" -print -quit)
          test -n "$PROJECT"
          INFO=$(xcodebuild -list -json -project "$PROJECT")
          SCHEME=$(printf '%s' "$INFO" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["project"]["schemes"][0])')
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build/ios/dd" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          set -eux
          APP=$(find "$GITHUB_WORKSPACE/build/ios/dd/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" -print -quit)
          test -n "$APP"
          mkdir -p "$GITHUB_WORKSPACE/build/ios/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/build/ios/Payload/"
          cd "$GITHUB_WORKSPACE/build/ios"
          zip -qr "$GITHUB_WORKSPACE/KOKBORI-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/KOKBORI-unsigned.ipa"

      - name: Upload Godot export diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-iOS-build-diagnostics
          path: build/ios/godot-export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-iOS-unsigned-IPA
          path: KOKBORI-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
