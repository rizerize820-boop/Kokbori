name: Build KOKBORI signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: "Provisioning profile type"
        required: true
        type: choice
        options:
          - app-store
          - ad-hoc
          - enterprise
          - development

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required KOKBORI signing secrets
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          [[ -n "$P12" ]] || { echo "::error::Missing IOS_CERTIFICATE_BASE64"; exit 1; }
          [[ -n "$P12_PASSWORD" ]] || { echo "::error::Missing IOS_CERTIFICATE_PASSWORD"; exit 1; }
          [[ -n "$PROFILE" ]] || { echo "::error::Missing IOS_PROVISION_PROFILE_BASE64"; exit 1; }
          

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kokbori-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'\"' '/Apple (Development|Distribution)/ {print $2; exit}')"
          [[ -n "$IDENTITY" ]] || { echo "::error::No usable Apple signing identity found in the supplied certificate"; exit 1; }
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST" > "$RUNNER_TEMP/profile-app-id.txt"
          /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST" > "$RUNNER_TEMP/profile-team-id.txt"
          echo "profile_app_id=$(cat "$RUNNER_TEMP/profile-app-id.txt")" >> "$GITHUB_OUTPUT"
          echo "profile_team_id=$(cat "$RUNNER_TEMP/profile-team-id.txt")" >> "$GITHUB_OUTPUT"

      
      - name: Install Godot 4.3 and iOS export templates
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo ditto "$RUNNER_TEMP/godot/Godot.app" /Applications/Godot.app
          curl -L --fail --retry 3 https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -o "$RUNNER_TEMP/godot/templates.tpz"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"

      - name: Configure iOS export preset
        env:
          TEAM_ID: ${{ secrets.KOKBORI_IOS_TEAM_ID }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path("Engine/export_presets.cfg")
          s = p.read_text()
          replacements = {
              'application/app_store_team_id="YOUR_10_CHARACTER_APPLE_TEAM_ID"': f'application/app_store_team_id="{os.environ["TEAM_ID"]}"',
              'application/export_project_only=true': 'application/export_project_only=false',
              'application/code_sign_identity_release=""': f'application/code_sign_identity_release="{os.environ["IDENTITY"]}"',
              'application/provisioning_profile_uuid_release=""': f'application/provisioning_profile_uuid_release="{os.environ["PROFILE_UUID"]}"',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected export setting not found: {old}")
              s = s.replace(old, new)
          methods = {"app-store": 0, "ad-hoc": 1, "enterprise": 2, "development": 3}
          method = methods[os.environ["EXPORT_METHOD"]]
          s = s.replace("application/export_method_release=0", f"application/export_method_release={method}")
          p.write_text(s)
          PY

      - name: Import project and export signed IPA
        run: |
          set -eux
          GODOT="/Applications/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --editor --path Engine --quit
          mkdir -p build
          "$GODOT" --headless --path Engine --export-release "iOS" build/KOKBORI.ipa
          test -s build/KOKBORI.ipa
          file build/KOKBORI.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-signed-IPA
          path: build/KOKBORI.ipa
          if-no-files-found: error
          retention-days: 7
