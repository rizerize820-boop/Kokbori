name: Build KOKBORI Native iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate native Xcode project
        working-directory: Native
        run: xcodegen generate --spec project.yml

      - name: Build unsigned native iOS app
        working-directory: Native
        run: |
          xcodebuild \
            -project KOKBORIRP.xcodeproj \
            -scheme KOKBORIRP \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/KOKBORI-DerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/KOKBORI-DerivedData/Build/Products/Release-iphoneos/KOKBORIRP.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "KOKBORIRP.app was not found at $APP_PATH"
            find "$RUNNER_TEMP/KOKBORI-DerivedData/Build/Products" -maxdepth 4 -name '*.app' -print || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/KOKBORIRP.app
          /usr/bin/zip -qry KOKBORI-RP-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KOKBORI-RP-unsigned-IPA
          path: KOKBORI-RP-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
