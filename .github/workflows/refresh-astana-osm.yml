name: Refresh Astana OpenStreetMap data
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 1 * *"
  push:
    paths:
      - "tools/fetch_astana_osm.py"
      - ".github/workflows/refresh-astana-osm.yml"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Astana map features
        run: python3 tools/fetch_astana_osm.py
      - name: Commit updated map snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Engine/data/astana_osm.geojson
          if git diff --cached --quiet; then
            echo "OSM snapshot is unchanged"
            exit 0
          fi
          git commit -m "Refresh Astana OpenStreetMap snapshot"
          git push
