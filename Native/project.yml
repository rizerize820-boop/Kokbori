name: KOKBORIRP
options:
  bundleIdPrefix: com.kokbori
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  KOKBORIRP:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: KOKBORI RP
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes:
          - crmpclient
        NSLocalNetworkUsageDescription: "KOKBORI RP использует локальную сеть для опроса игровых серверов."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kokbori.rp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KOKBORI RP
        TARGETED_DEVICE_FAMILY: "1,2"
